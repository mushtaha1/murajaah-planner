<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Muraja'ah Planner</title>
<meta name="description" content="Plan your daily Quran revision by strength: red, yellow and green quarters, with 5-juz blocks that lock once fully green.">
<meta name="theme-color" content="#F2F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muraja'ah">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: single-column phone app, max 520px, sticky header + fixed bottom tab bar. Mushaf-green ink on cool paper; red/yellow/green carry the meaning. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#14302A; --muted:#5B6F69; --line:#D8E0DC; --accent:#1E5B4E; --accent-ink:#FFFFFF;
  --r:#C2453B; --r-soft:#F7DCD8; --y:#B8890C; --y-soft:#F6EAC2; --g:#3A8A55; --g-soft:#D6ECDB; --none:#E6ECE9; --none-ink:#8A9A95;
  --shadow:0 1px 2px rgba(20,48,42,.06),0 4px 14px rgba(20,48,42,.06);
  --f-display:"Amiri",Georgia,serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1614; --surface:#16211E; --ink:#E4EEEA; --muted:#93A6A0; --line:#273430; --accent:#6CC0A7; --accent-ink:#0E1614;
  --r:#E46A5E; --r-soft:#3B201D; --y:#E0B63A; --y-soft:#383019; --g:#5CBA7C; --g-soft:#1B3223; --none:#1D2825; --none-ink:#6E817B;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#16211E; --ink:#E4EEEA; --muted:#93A6A0; --line:#273430; --accent:#6CC0A7; --accent-ink:#0E1614;
  --r:#E46A5E; --r-soft:#3B201D; --y:#E0B63A; --y-soft:#383019; --g:#5CBA7C; --g-soft:#1B3223; --none:#1D2825; --none-ink:#6E817B;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1;letter-spacing:.2px}
.brand small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted);margin-left:8px;letter-spacing:.3px}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.banner{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--y-soft);font-size:13px}
main{display:flex;flex-direction:column;gap:22px;padding-top:16px}
h2{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-head .hint{font-size:12px;color:var(--muted);text-align:right}
.mono{font-variant-numeric:tabular-nums}

/* Today summary */
.day{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.day .date{font-family:var(--f-display);font-size:30px;line-height:1.05;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--none);color:var(--ink)}
.chip.we{background:var(--accent);color:var(--accent-ink)}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-size:15px}
.bar{height:6px;border-radius:99px;background:var(--none);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* Items */
.item{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 12px 12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-left:5px solid var(--none)}
.item.R{border-left-color:var(--r)} .item.Y{border-left-color:var(--y)} .item.G{border-left-color:var(--g)}
.item .name{font-weight:700;font-size:16px}
.item .meta{font-size:12.5px;color:var(--muted);min-width:0}
.rate{display:flex;gap:6px}
.rate button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:700;font-size:15px}
.rate .bR{color:var(--r)} .rate .bY{color:var(--y)} .rate .bG{color:var(--g)}
.rate .bR:active,.rate .bR.on{background:var(--r);color:#fff;border-color:var(--r)}
.rate .bY:active,.rate .bY.on{background:var(--y);color:#fff;border-color:var(--y)}
.rate .bG:active,.rate .bG.on{background:var(--g);color:#fff;border-color:var(--g)}
.item.done{opacity:.72;box-shadow:none;background:transparent;border:1px dashed var(--line);border-left-width:5px}
.res{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.pip{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;font-weight:700;font-size:12px;color:#fff}
.pip.R{background:var(--r)} .pip.Y{background:var(--y)} .pip.G{background:var(--g)}
.link{background:none;border:0;padding:4px 2px;color:var(--accent);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.empty{font-size:13px;color:var(--muted);padding:12px 14px;border:1px dashed var(--line);border-radius:12px}

/* Block card */
.block{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.mini button{height:34px;border:0;border-radius:8px;font-size:11px;font-weight:700;color:#fff}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--r);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* Map */
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.count{background:var(--surface);border-radius:12px;padding:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.count b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.count span{font-size:11.5px;color:var(--muted)}
.count.R b{color:var(--r)} .count.Y b{color:var(--y)} .count.G b{color:var(--g)}
.paint{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.paint .lbl{font-size:13px;font-weight:600;margin-right:auto}
.brush{width:38px;height:34px;border-radius:9px;border:2px solid transparent;font-weight:700;font-size:12px;color:#fff}
.brush.on{border-color:var(--ink)}
.toggle{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.toggle.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid{display:flex;flex-direction:column;gap:4px}
.blk-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);padding:10px 2px 2px;font-weight:600}
.blk-head .lock{color:var(--g)}
.jrow{display:grid;grid-template-columns:40px repeat(4,1fr);gap:4px;align-items:stretch}
.jnum{border:0;background:transparent;font-family:var(--f-display);font-size:19px;font-weight:700;text-align:left;padding:0 2px;color:var(--ink)}
.cell{border:0;border-radius:7px;height:38px;font-size:11px;font-weight:600;background:var(--none);color:var(--none-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.cell small{font-size:9.5px;font-weight:500;opacity:.85}
.cR{background:var(--r);color:#fff} .cY{background:var(--y);color:#fff} .cG{background:var(--g);color:#fff}

/* History */
.hday{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.hday .d{font-weight:700;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;font-weight:600;padding:3px 7px;border-radius:7px;font-variant-numeric:tabular-nums}
.tag.R{background:var(--r-soft);color:var(--r)} .tag.Y{background:var(--y-soft);color:var(--y)} .tag.G{background:var(--g-soft);color:var(--g)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:11.5px;color:var(--muted);font-weight:600}
textarea.copy{width:100%;min-height:150px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:13px/1.5 var(--f-body);padding:10px}

/* Settings */
.form{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:4px 14px}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-size:14px}
.field label small{display:block;font-size:12px;color:var(--muted)}
.field input[type=number]{width:72px;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;text-align:center}
.days{display:flex;gap:4px}
.days button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:transparent;font-size:12px;font-weight:600}
.days button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{font-size:12.5px;color:var(--muted)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:18px 18px 0 0;max-width:520px;margin:0 auto;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet h3{margin:0;font-family:var(--f-display);font-size:24px}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:transparent;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:40;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">مراجعة<small>Muraja'ah Planner</small></div>
    <div class="sync" id="sync">Saved on this phone</div>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div id="overlay"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
const JUZ_START=["Al-Fatihah 1","Al-Baqarah 142","Al-Baqarah 253","Al Imran 93","An-Nisa 24","An-Nisa 148","Al-Ma'idah 82","Al-An'am 111","Al-A'raf 88","Al-Anfal 41","At-Tawbah 93","Hud 6","Yusuf 53","Al-Hijr 1","Al-Isra 1","Al-Kahf 75","Al-Anbiya 1","Al-Mu'minun 1","Al-Furqan 21","An-Naml 56","Al-Ankabut 46","Al-Ahzab 31","Ya-Sin 28","Az-Zumar 32","Fussilat 47","Al-Ahqaf 1","Adh-Dhariyat 31","Al-Mujadilah 1","Al-Mulk 1","An-Naba 1"];
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DEFAULTS={redMin:null,yelMin:15,grnMin:5,wd:{R:1,Y:2,G:3},we:{R:2,Y:2,G:0,B:1},weekend:[5,6],redReads:3,avail:null};
const LS="murajaah.v1";
const fresh=()=>({v:1,rev:"",settings:JSON.parse(JSON.stringify(DEFAULTS)),q:{},logs:{},example:false});

let S=fresh(), tab="today", paint=null, sheet=null, blockEdit=null, toastT=null, resetArm=false;
let ref=null, mode="local", writing=false, dirty=false;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>keyOf(new Date());
const parseKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const daysBetween=(a,b)=>Math.round((parseKey(b)-parseKey(a))/864e5);
const juzOf=i=>Math.floor(i/4)+1, qOf=i=>i%4+1, blkOf=i=>Math.floor(i/20)+1;
const label=i=>"Juz "+juzOf(i)+" · Q"+qOf(i);
const short=i=>"J"+juzOf(i)+"-Q"+qOf(i);
const startOf=i=>qOf(i)===1?"Starts "+JUZ_START[juzOf(i)-1]:"";
const Q=i=>S.q[i];
const mem=i=>!!(S.q[i]&&S.q[i].b);
const cur=i=>S.q[i]?(S.q[i].c||S.q[i].b):null;
const ago=d=>{if(!d)return"never read";const n=daysBetween(d,today());return n<=0?"read today":n===1?"read yesterday":"read "+n+" days ago"};
const fmtDate=k=>parseKey(k).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const isWeekend=()=>S.settings.weekend.includes(new Date().getDay());
const ST=()=>S.settings;

function locked(b){for(let i=(b-1)*20;i<b*20;i++){if(cur(i)!=="G")return false}return true}

/* ---------- plan ---------- */
function plan(){
  const t=today(), log=S.logs[t]||[], we=isWeekend();
  const tgt=we?ST().we:Object.assign({},ST().wd,{B:0});
  const readToday=new Set(log.map(e=>e[0]));
  const out={R:[],Y:[],G:[],B:[]};
  log.forEach((e,idx)=>{if(e[2]==="R"||e[2]==="Y"||e[2]==="G")out[e[2]].push({i:e[0],done:e,idx})});
  const doneBlocks=[...new Set(log.filter(e=>e[2]==="B").map(e=>blkOf(e[0])))];
  const cand=c=>{
    const a=[];for(let i=0;i<120;i++){if(mem(i)&&cur(i)===c&&!readToday.has(i)&&(c!=="G"||!locked(blkOf(i))))a.push(i)}
    if(c!=="R")a.sort((x,y)=>{const dx=Q(x).d||"",dy=Q(y).d||"";return dx<dy?-1:dx>dy?1:x-y});
    return a;
  };
  for(const c of ["R","Y","G"]){
    const need=Math.max(0,(tgt[c]||0)-out[c].length);
    cand(c).slice(0,need).forEach(i=>out[c].push({i}));
  }
  doneBlocks.forEach(b=>out.B.push({b,done:true}));
  const needB=Math.max(0,(tgt.B||0)-doneBlocks.length);
  if(needB){
    const bl=[];for(let b=1;b<=6;b++){if(locked(b)&&!doneBlocks.includes(b)){let m=null;for(let i=(b-1)*20;i<b*20;i++){const d=Q(i).d||"";if(m===null||d<m)m=d}bl.push({b,m})}}
    bl.sort((x,y)=>x.m<y.m?-1:x.m>y.m?1:x.b-y.b);
    bl.slice(0,needB).forEach(x=>out.B.push({b:x.b,last:x.m}));
  }
  return {out,we,tgt};
}

/* ---------- mutations ---------- */
function logRead(i,c,bucket){
  const q=S.q[i];const e=[i,c,bucket,q.c||q.b,q.d||null];
  q.c=c;q.d=today();(S.logs[today()]=S.logs[today()]||[]).push(e);
}
function undoEntries(pred){
  const t=today(),log=S.logs[t]||[];
  for(let k=log.length-1;k>=0;k--){const e=log[k];if(pred(e,k)){const q=S.q[e[0]];if(q){q.c=e[3];q.d=e[4]}log.splice(k,1)}}
  if(!log.length)delete S.logs[t];
}
function prune(){const t=today();for(const k of Object.keys(S.logs)){if(daysBetween(k,t)>60)delete S.logs[k]}}
function commit(msg,undo){prune();S.rev=Date.now()+"-"+Math.random().toString(36).slice(2,7);save();render();if(msg)toast(msg,undo)}

/* ---------- storage ---------- */
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem(LS);if(r){const d=JSON.parse(r);if(d&&d.v===1)return d}}catch(e){}return null}
function normalise(d){const s=fresh();Object.assign(s,d);s.settings=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),d.settings||{});s.q=d.q||{};s.logs=d.logs||{};return s}
function save(){saveLocal();schedulePush()}
function setSync(t){$("#sync").textContent=t}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);

/* ---------- account + sync (Supabase) ----------
   The phone stays the working copy, so the app works offline and signed out.
   When signed in, the whole state is mirrored to one row per user; the newer copy wins. */
const CFG=window.MURAJAAH_CONFIG||{};
const TABLE="revision_state";
let sb=null,session=null,pending=false,pushing=false,pushT=null,lastSync=null,delArm=false;
const auth={step:"email",email:"",busy:false,msg:""};
const tsOf=s=>parseInt((s&&s.rev)||"0",10)||0;
const hasData=s=>!!s&&Object.keys(s.q||{}).length>0;
const syncReady=()=>!!(CFG.supabaseUrl&&CFG.supabaseKey);
function initSync(){
  if(!syncReady()||!window.supabase)return;
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:"murajaah.auth"}});
  sb.auth.onAuthStateChange((ev,s)=>{
    const was=session;session=s||null;
    if(session&&!was)setTimeout(pull,0);
    updateSync();if(tab==="settings")render();
  });
  window.addEventListener("online",()=>{if(pending)push();else pull()});
  window.addEventListener("offline",updateSync);
}
function updateSync(){
  if(!session){setSync("Saved on this phone");return}
  setSync(!navigator.onLine?"Offline · will sync":pushing?"Syncing…":pending?"Not synced yet":"Synced");
}
async function pull(){
  if(!sb||!session||pushing)return;
  const {data,error}=await sb.from(TABLE).select("data").eq("user_id",session.user.id).maybeSingle();
  if(error){updateSync();return}
  if(!data){if(hasData(S)&&!S.example)push();else{lastSync=Date.now();updateSync()}return}
  const remote=normalise(data.data);
  if(!hasData(S)||S.example){S=remote;saveLocal();render()}
  else if(tsOf(remote)>tsOf(S)&&!pending){
    if(S.rev!==remote.rev){try{localStorage.setItem(LS+".before-sync",JSON.stringify(S))}catch(e){}}
    S=remote;saveLocal();render();
  }
  else if(tsOf(S)>tsOf(remote)){push();return}
  lastSync=Date.now();updateSync();
}

async function push(){

  if(!navigator.onLine){pending=true;updateSync();return}
  clearTimeout(pushT);pushing=true;pending=false;updateSync();
  const {error}=await sb.from(TABLE).upsert({user_id:session.user.id,data:JSON.parse(JSON.stringify(S)),updated_at:new Date().toISOString()});

}
async function sendCode(){
  const email=($("#authEmail")||{}).value?$("#authEmail").value.trim():auth.email.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){auth.msg="Enter a valid email address.";render();return}
  auth.email=email;auth.busy=true;auth.msg="";render();
  const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});
  auth.busy=false;
  if(error)auth.msg=/rate|seconds|too many/i.test(error.message)?"Too many codes requested. Wait a minute and try again.":"Couldn't send the code: "+error.message;
  else{auth.step="code";auth.msg=""}
  render();
}
async function verifyCode(){
  const token=(($("#authCode")||{}).value||"").replace(/\D/g,"");
  if(token.length<6){auth.msg="Enter the code from the email.";render();return}
  auth.busy=true;auth.msg="";render();
  const {error}=await sb.auth.verifyOtp({email:auth.email,token,type:"email"});
  auth.busy=false;
  if(error){auth.msg="That code didn't work. Check it, or request a new one.";render();return}
  auth.step="email";toast("Signed in");
}

async function exportBackup(){
  const name="murajaah-backup-"+today()+".json";

function minutes(p){
  const s=ST();let m=0,missing=false;

  add(p.out.R.length,s.redMin);add(p.out.Y.length,s.yelMin);add(p.out.G.length,s.grnMin);add(p.out.B.length*20,s.grnMin);

    h+='<div class="note">'+(startOf(i)?startOf(i)+" · ":"")+(c?"Now "+({R:"red",Y:"yellow",G:"green"})[c]+" · "+ago(q.d)+" · baseline "+q.b:"Not memorised yet")+'</div>';
    if(c){
      h+='<div><div class="note" style="margin-bottom:6px">Read it now? Log how it went:</div>'+rateBtns(i,"X")+'</div>';
      h+='<div><div class="note" style="margin-bottom:6px">Or correct its colour without logging a read:</div><div class="row">'+["R","Y","G"].map(k=>'<button class="brush c'+k+(c===k?" on":"")+'" data-act="setc" data-i="'+i+'" data-c="'+k+'">'+k+'</button>').join("")+'<button class="link" data-act="clearq" data-i="'+i+'">Mark as not memorised</button></div></div>';
    }else{
      h+='<div class="row">'+["R","Y","G"].map(k=>'<button class="brush c'+k+'" data-act="setc" data-i="'+i+'" data-c="'+k+'">'+k+'</button>').join("")+'</div><div class="note">Just memorised it and read it to your teacher? Mark it green.</div>';
    }
    h+='<button class="btn ghost" data-act="close">Close</button></div>';
  }
  o.innerHTML=h;
}
function toast(msg,undo){
  clearTimeout(toastT);let el=$(".toast");if(el)el.remove();
  el=document.createElement("div");el.className="toast";el.setAttribute("role","status");
  el.textContent=msg;
  if(undo){const b=document.createElement("button");b.textContent="Undo";b.onclick=()=>{undo();el.remove()};el.appendChild(b)}
  document.body.appendChild(el);toastT=setTimeout(()=>el.remove(),3500);
}

/* ---------- example data ---------- */
function loadExample(){
  S=fresh();S.example=true;
  for(let i=0;i<72;i++){const j=juzOf(i);const c=j<=9?"G":j<=11?"R":j<=13?"Y":["G","Y","G","R"][i%4];S.q[i]={b:c,c:c,d:null}}
  commit("Example data loaded");
}

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act,i=t.dataset.i!=null?+t.dataset.i:null,v=t.dataset.v;
  switch(a){
    case "tab":tab=v;sheet=null;resetArm=false;render();window.scrollTo(0,0);break;
    case "log":{logRead(i,t.dataset.c,t.dataset.b);const was=sheet;sheet=null;commit(short(i)+" logged as "+t.dataset.c,()=>{undoEntries((e,k)=>e[0]===i&&k===(S.logs[today()]||[]).length-1);commit()});break}
    case "undo":{const b=t.dataset.b;let n=0;undoEntries(e=>{if(n)return false;if(e[0]===i&&e[2]===b){n=1;return true}return false});commit();break}
    case "ball":{const b=+v;for(let k=(b-1)*20;k<b*20;k++)logRead(k,"G","B");commit("Block "+b+" logged")}break;
    case "bedit":{const b=+v,c={};for(let k=(b-1)*20;k<b*20;k++)c[k]="G";blockEdit={b,c};render()}break;
    case "bcycle":{const o=blockEdit.c[i];blockEdit.c[i]=o==="G"?"Y":o==="Y"?"R":"G";render()}break;
    case "bcancel":blockEdit=null;render();break;
    case "bsave":{const b=+v;for(let k=(b-1)*20;k<b*20;k++)logRead(k,blockEdit.c[k],"B");blockEdit=null;commit("Block "+b+" logged")}break;
    case "undoblock":{const b=+v;undoEntries(e=>e[2]==="B"&&blkOf(e[0])===b);commit()}break;
    case "startpaint":tab="map";paint="G";render();break;
    case "example":loadExample();break;
    case "painttoggle":paint=paint?null:"G";render();break;
    case "brush":paint=v;render();break;
    case "cell":
      if(paint)paintCell(i,paint),commit();
      else{sheet=i;renderOverlay()}
      break;
    case "juz":if(paint){const j=+v;for(let q=0;q<4;q++)paintCell((j-1)*4+q,paint);commit()}else{sheet=(+v-1)*4;renderOverlay()}break;
    case "setc":{const q=S.q[i];const c=t.dataset.c;if(q&&q.b){q.c=c}else{S.q[i]={b:c,c:c,d:null}}sheet=null;commit(short(i)+" set to "+c)}break;
    case "clearq":delete S.q[i];sheet=null;commit(short(i)+" cleared");break;
    case "close":sheet=null;renderOverlay();break;
    case "wday":{const k=+v,w=ST().weekend;const at=w.indexOf(k);if(at>=0)w.splice(at,1);else w.push(k);commit()}break;
    case "copy":{const ta=$("#sum");const txt=ta.value;
      const fallback=()=>{ta.focus();ta.select();toast("Selected. Copy it from the menu.")};
      try{navigator.clipboard.writeText(txt).then(()=>toast("Summary copied"),fallback)}catch(e){fallback()}}break;
    case "export":exportBackup();break;
    case "import":$("#importFile").click();break;
    case "sendcode":sendCode();break;
    case "verify":verifyCode();break;
    case "authback":auth.step="email";auth.msg="";render();break;
    case "signout":signOut();break;
    case "syncnow":if(pending)push();else pull();break;
    case "delarm":delArm=true;render();break;
    case "delno":delArm=false;render();break;
    case "delsync":deleteSynced();break;
    case "resetarm":resetArm=true;render();break;
    case "resetno":resetArm=false;render();break;
    case "reset":resetArm=false;{const keep=S.settings;S=fresh();if(!S.example)S.settings=keep;}commit("All data erased");break;
  }
});
function paintCell(i,c){
  if(c==="N"){delete S.q[i];return}
  const q=S.q[i];if(q){q.b=c;q.c=c}else S.q[i]={b:c,c:c,d:null};
  S.example=false;
}
let setT=null;
document.addEventListener("input",ev=>{
  if(ev.target.id==="authEmail"){auth.email=ev.target.value;return}
  const k=ev.target.dataset.set;if(!k)return;
  const raw=ev.target.value.trim();const val=raw===""?null:Math.max(0,Number(raw));
  if(raw!==""&&!isFinite(val))return;
  const s=ST();
  if(k.includes(".")){const [g,c]=k.split(".");s[g][c]=val==null?0:val}else s[k]=val;
  clearTimeout(setT);setT=setTimeout(()=>{prune();S.rev=Date.now()+"-"+Math.random().toString(36).slice(2,7);save()},600);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet!=null){sheet=null;renderOverlay()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){render();if(session&&!pending)pull()}});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;if(e.target.id==="authEmail")sendCode();else if(e.target.id==="authCode")verifyCode()});

render();connect();
})();
</script>
